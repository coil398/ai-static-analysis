name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The full suite spawns gopls, jdtls, HLS, clojure-lsp, elixir-ls,
    # clangd, pyright, csharp-ls, rust-analyzer and typescript-language-server
    # in sequence. Each LSP boot can add a minute. 60 minutes gives the runs
    # headroom even when caches are cold.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Go tools
        run: |
          go install golang.org/x/tools/gopls@v0.21.1
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/kisielk/errcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/mibk/dupl@latest

      - name: Install TypeScript tools
        run: npm install -g typescript typescript-language-server eslint prettier

      - name: Install Rust tools
        run: |
          rustup component add rust-analyzer clippy rustfmt
          cargo install cargo-audit

      - name: Install Python tools
        run: pip install --break-system-packages ruff mypy bandit pytest pyright

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install jdtls (Eclipse JDT LSP)
        run: |
          set -euo pipefail
          curl -fsSL "https://download.eclipse.org/jdtls/snapshots/jdt-language-server-latest.tar.gz" -o /tmp/jdtls.tar.gz
          sudo mkdir -p /opt/jdtls
          sudo tar -xzf /tmp/jdtls.tar.gz -C /opt/jdtls
          sudo tee /usr/local/bin/jdtls > /dev/null <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          JDTLS_HOME="${JDTLS_HOME:-/opt/jdtls}"
          LAUNCHER="$(ls "$JDTLS_HOME"/plugins/org.eclipse.equinox.launcher_*.jar 2>/dev/null | head -n 1)"
          if [ -z "$LAUNCHER" ]; then
            echo "jdtls: launcher jar not found under $JDTLS_HOME/plugins" >&2
            exit 1
          fi
          CONFIG="${JDTLS_CONFIG:-$JDTLS_HOME/config_linux}"
          exec java \
            -Declipse.application=org.eclipse.jdt.ls.core.id1 \
            -Dosgi.bundles.defaultStartLevel=4 \
            -Declipse.product=org.eclipse.jdt.ls.core.product \
            -Dlog.level=ERROR \
            -Xmx2G \
            --add-modules=ALL-SYSTEM \
            --add-opens java.base/java.util=ALL-UNNAMED \
            --add-opens java.base/java.lang=ALL-UNNAMED \
            -jar "$LAUNCHER" \
            -configuration "$CONFIG" \
            "$@"
          EOF
          sudo chmod +x /usr/local/bin/jdtls
          jdtls --help >/dev/null 2>&1 || true

      - name: Install C++ tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clangd-18 clang-format clang-tidy cppcheck cmake
          sudo ln -sf /usr/bin/clangd-18 /usr/local/bin/clangd

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.4'
          cabal-version: '3.10.3.0'
          enable-stack: false

      - name: Install HLS
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/haskell/haskell-language-server/releases/download/2.7.0.0/haskell-language-server-2.7.0.0-x86_64-linux-deb11.tar.xz" -o /tmp/hls.tar.xz
          sudo mkdir -p /opt/hls
          sudo tar -xJf /tmp/hls.tar.xz -C /opt/hls
          sudo ln -sf /opt/hls/haskell-language-server-2.7.0.0/bin/haskell-language-server-wrapper /usr/local/bin/haskell-language-server-wrapper
          sudo ln -sf /opt/hls/haskell-language-server-2.7.0.0/bin/haskell-language-server-9.6.4 /usr/local/bin/haskell-language-server
          haskell-language-server-wrapper --version

      - name: Install Clojure CLI and clojure-lsp
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh "https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh"
          sudo bash /tmp/clj-install.sh
          curl -fsSL "https://github.com/clojure-lsp/clojure-lsp/releases/latest/download/clojure-lsp-native-static-linux-amd64.zip" -o /tmp/clojure-lsp.zip
          cd /tmp && unzip -q -o clojure-lsp.zip
          sudo mv /tmp/clojure-lsp /usr/local/bin/clojure-lsp
          sudo chmod +x /usr/local/bin/clojure-lsp
          clojure-lsp --version

      - name: Install Elixir and elixir-ls
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends elixir
          ELIXIR_LS_URL=$(curl -sL "https://api.github.com/repos/elixir-lsp/elixir-ls/releases/latest" | grep "browser_download_url.*zip" | head -1 | cut -d '"' -f 4)
          curl -fsSL "$ELIXIR_LS_URL" -o /tmp/elixir-ls.zip
          sudo mkdir -p /opt/elixir-ls
          cd /opt/elixir-ls && sudo unzip -q -o /tmp/elixir-ls.zip
          sudo chmod +x /opt/elixir-ls/language_server.sh
          sudo ln -sf /opt/elixir-ls/language_server.sh /usr/local/bin/elixir-ls

      - name: Pre-compile testdata so LSPs return useful results
        run: |
          set -euo pipefail
          # Elixir: mix compile so elixir-ls' documentSymbol returns symbols
          (cd adapters/elixir/testdata && mix deps.get && mix compile)
          # C++: regenerate compile_commands.json
          (cd adapters/cpp/testdata && cmake -B build -S . > /dev/null && cp build/compile_commands.json . && rm -rf build)

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
