name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install gopls
        run: go install golang.org/x/tools/gopls@v0.17.1

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
